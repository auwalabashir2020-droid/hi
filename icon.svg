<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e2d" />
      <stop offset="40%" stop-color="#142c40" />
      <stop offset="100%" stop-color="#1d3e5a" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fff2b3" />
      <stop offset="25%" stop-color="#e5b842" />
      <stop offset="50%" stop-color="#ffd769" />
      <stop offset="75%" stop-color="#c9921e" />
      <stop offset="100%" stop-color="#91640a" />
    </linearGradient>

    <!-- Soft Gold Gradient for accents -->
    <linearGradient id="softGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfa92c" />
      <stop offset="100%" stop-color="#fae08c" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="luxuryShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Path for Circular Arcs -->
    <path id="topArc" d="M 90 300 A 210 210 0 0 1 510 300" fill="none" />
    <path id="bottomArc" d="M 515 300 A 215 215 0 0 1 85 300" fill="none" />
  </defs>

  <!-- Background Base Circle with soft rim -->
  <circle cx="300" cy="300" r="290" fill="url(#bgGradient)" />
  
  <!-- Outer Double Rings with Stitch Details -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#f6ce65" stroke-width="2" stroke-dasharray="8 6" opacity="0.85" />
  <circle cx="300" cy="300" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="300" cy="300" r="214" fill="none" stroke="#e5b842" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Circular Curved Brand Typography -->
  <!-- Top Arc: "A AND BRO'S" -->
  <text font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
        font-weight="900" font-size="34" letter-spacing="9" fill="url(#goldGrad)" filter="url(#luxuryShadow)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      A AND BRO'S
    </textPath>
  </text>

  <!-- Bottom Arc: "FABRIC & FASHION DESIGN" -->
  <text font-family="system-ui, -apple-system, 'Montserrat', sans-serif" 
        font-weight="700" font-size="20" letter-spacing="6" fill="#e8edf2" opacity="0.95">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★ FABRIC &amp; FASHION DESIGN ★
    </textPath>
  </text>

  <!-- Central Crest Area -->
  <g filter="url(#luxuryShadow)">
    <!-- Decorative Inner Badge -->
    <circle cx="300" cy="300" r="195" fill="#112435" stroke="url(#goldGrad)" stroke-width="2" opacity="0.75" />

    <!-- Crown / Haute Couture Coronet atop center -->
    <g transform="translate(300, 168)" fill="url(#goldGrad)">
      <path d="M -36 18 L -44 -6 L -20 6 L 0 -16 L 20 6 L 44 -6 L 36 18 Z" />
      <circle cx="-44" cy="-9" r="3.5" fill="#fff5cc"/>
      <circle cx="0" cy="-19" r="4.5" fill="#fff5cc"/>
      <circle cx="44" cy="-9" r="3.5" fill="#fff5cc"/>
      <rect x="-34" y="21" width="68" height="3" rx="1.5" fill="url(#goldGrad)" />
      <!-- Gems on band -->
      <circle cx="-20" cy="22.5" r="2" fill="#142c40" />
      <circle cx="0" cy="22.5" r="2.5" fill="#142c40" />
      <circle cx="20" cy="22.5" r="2" fill="#142c40" />
    </g>

    <!-- Crossed Tailor Shears (Scissors) -->
    <g transform="translate(300, 310)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Blade & Handle -->
      <g transform="rotate(-32)">
        <path d="M 0 -85 L 0 20 L -12 60" fill="none" stroke-width="7" />
        <path d="M -3 -82 L -12 0 L -3 20" fill="url(#goldGrad)" opacity="0.7"/>
        <ellipse cx="-24" cy="85" rx="16" ry="22" fill="none" stroke-width="6" />
      </g>
      <!-- Right Blade & Handle -->
      <g transform="rotate(32)">
        <path d="M 0 -85 L 0 20 L 12 60" fill="none" stroke-width="7" />
        <path d="M 3 -82 L 12 0 L 3 20" fill="url(#goldGrad)" opacity="0.7"/>
        <ellipse cx="24" cy="85" rx="16" ry="22" fill="none" stroke-width="6" />
      </g>
      <!-- Scissors Pivot screw -->
      <circle cx="0" cy="12" r="7" fill="url(#goldGrad)" stroke="#112435" stroke-width="2" />
      <circle cx="0" cy="12" r="2.5" fill="#ffffff" />
    </g>

    <!-- Golden Needle & Looping Thread -->
    <!-- Looping Thread -->
    <path d="M 215 370 C 180 320, 230 250, 300 240 C 370 230, 410 310, 380 360 C 350 400, 260 410, 240 370" 
          fill="none" stroke="url(#softGold)" stroke-width="3" stroke-dasharray="7 4" opacity="0.85" />
    <!-- Needle -->
    <g transform="translate(300, 300) rotate(52)">
      <path d="M 0 -110 L 4 20 L 0 45 L -4 20 Z" fill="url(#goldGrad)" />
      <!-- Needle Eye -->
      <ellipse cx="0" cy="-90" rx="1.5" ry="7" fill="#142c40" />
    </g>

    <!-- Central Monogram: "A & B" -->
    <!-- Letter A -->
    <text x="250" y="335" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-weight="900" font-size="96" 
          fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">
      A
    </text>

    <!-- Ampersand & -->
    <text x="300" y="325" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-style="italic" font-weight="700" font-size="52" 
          fill="#ffffff" text-anchor="middle" opacity="0.95">
      &amp;
    </text>

    <!-- Letter B -->
    <text x="350" y="335" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-weight="900" font-size="96" 
          fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">
      B
    </text>

    <!-- Ribbon / Banner below monogram with "ESTD. BESPOKE" -->
    <g transform="translate(300, 420)">
      <path d="M -90 -14 L 90 -14 L 80 14 L -80 14 Z" fill="#142b3d" stroke="url(#goldGrad)" stroke-width="1.8" />
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" 
            font-size="12" font-weight="800" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">
        HAUTE COUTURE
      </text>
    </g>
  </g>
</svg>